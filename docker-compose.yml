# Docker Compose para Sistema RAG - Cerebro y Código

services:
  rag-cerebro-codigo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-cerebro-codigo
    ports:
      - "8501:8501"
    environment:
      - COHERE_API_KEY=${COHERE_API_KEY}
    volumes:
      # Persistencia de ChromaDB (opcional)
      - chroma_data:/app/chroma_db
      # Si quieres modificar los datos sin reconstruir
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  chroma_data:
    driver: local

